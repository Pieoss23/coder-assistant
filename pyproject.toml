[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-harness"
version = "0.1.0"
description = "Harness per sviluppo software assistito da agenti, con piani approvabili e memoria persistente."
requires-python = ">=3.11"

[project.scripts]
coding-harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]
