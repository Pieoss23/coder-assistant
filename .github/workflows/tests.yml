name: tests

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test harness
        run: python -m unittest discover -s tests -v
      - name: Install Flask example dependencies
        run: python -m pip install -r examples/flask-login/requirements.txt
      - name: Test Flask example
        working-directory: examples/flask-login
        run: python -m unittest discover -s tests -v
